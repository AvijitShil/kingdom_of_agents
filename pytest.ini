[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --tb=short --strict-markers
markers =
    e2e: End-to-end integration and simulation tests
    tier1: Feature coverage tests (equivalence-class representatives)
    tier2: Boundary and corner cases (adversarial edge cases)
    tier3: Cross-feature interaction tests (pairwise combinations)
    tier4: Real-world complex application scenarios
    security: Sandbox and path confinement tests
    corpus: Knowledge base and retrieval tests
    evolution: Evolutionary agent and reflection tests
    sync: GitHub remote synchronization tests
